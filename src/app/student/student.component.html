<p>student portal!</p>

<button (click)="studentResult()">Get Result</button>
<h1 data-testid="result">{{studentCalcResult}}</h1>

<button data-testid="btnincreaseNumber" (click)="increaseNumber()" class="btn btn-primary">increase Number</button>
<button data-testid="btndecreaseNumber" (click)="decreaseNumber()" class="btn btn-primary" style="margin-left: 10px;">decrease Number</button>
<h1 data-testid="count">{{countNumber}}</h1>

<label for="name">Enter your age:</label>
<input data-testid="inputAge" [type]="type" [(ngModel)]="studentAge" [placeholder]="placeholder" />
<h1 data-testid="studentAge">{{studentAge}}</h1>
